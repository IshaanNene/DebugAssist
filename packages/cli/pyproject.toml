[project]
name = "debugassist-cli"
version = "0.1.0"
description = "The `debugassist` command"
requires-python = ">=3.13,<3.14"
dependencies = ["debugassist-evals", "debugassist-harness", "debugassist-decisions", "debugassist-scenarios", "debugassist-pipeline", "typer>=0.20"]

[project.scripts]
debugassist = "debugassist.cli:app"

[tool.uv.sources]
debugassist-evals = { workspace = true }
debugassist-harness = { workspace = true }
debugassist-decisions = { workspace = true }
debugassist-scenarios = { workspace = true }
debugassist-pipeline = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debugassist"]
