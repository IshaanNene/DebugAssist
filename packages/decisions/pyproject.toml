[project]
name = "debugassist-decisions"
version = "0.1.0"
description = "DebugAssist decision engine: Clef / Clef-flash (Workers AI), local, LLM baseline and mock backends"
requires-python = ">=3.13,<3.14"
dependencies = ["debugassist-core"]

[tool.uv.sources]
debugassist-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debugassist"]
