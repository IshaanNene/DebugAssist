[project]
name = "debugassist-simulator"
version = "0.1.0"
description = "MiniRide traffic simulator: Playwright rider fleet, scenario drivers, battery-panel images, Locust load"
requires-python = ">=3.13,<3.14"
dependencies = ["playwright>=1.63", "httpx>=0.28", "pillow>=11.3"]

[project.optional-dependencies]
load = ["locust>=2.40"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debugassist"]
