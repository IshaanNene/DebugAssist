[project]
name = "debugassist-pipeline"
version = "0.1.0"
description = "The fixed DebugAssist pipeline (LangGraph): ingest → triage → collect → RCA → mitigate → fix → validate → ship → PR"
requires-python = ">=3.13,<3.14"
dependencies = [
  "debugassist-core",
  "debugassist-decisions",
  "debugassist-integrations",
  "debugassist-llm",
  "debugassist-mcp-servers",
  "langgraph>=1.2",
  "langgraph-checkpoint-sqlite>=3.0",
  "pyyaml>=6.0",
  "httpx>=0.28",
]

[tool.uv.sources]
debugassist-core = { workspace = true }
debugassist-decisions = { workspace = true }
debugassist-integrations = { workspace = true }
debugassist-llm = { workspace = true }
debugassist-mcp-servers = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debugassist"]
