[project]
name = "debugassist-workspace"
version = "0.0.0"
description = "DebugAssist: crash/bug report → RCA → mitigation → validated PR, with Clef decision models"
requires-python = ">=3.13,<3.14"
readme = "README.md"
license = "MIT"
dependencies = ["debugassist-core", "debugassist-decisions", "vitals-service", "bugdrop-service", "incidents-service", "debugassist-simulator", "debugassist-scenarios", "debugassist-cli", "debugassist-integrations", "debugassist-mcp-servers", "debugassist-llm", "debugassist-pipeline", "debugassist-api"]

[tool.uv]
package = false
# uv-managed CPython: no distro sitecustomize.py shadowing scripts/venv_path_hook.py.
python-preference = "only-managed"

[tool.uv.workspace]
members = ["packages/*", "sources/*/service"]

[tool.uv.sources]
debugassist-core = { workspace = true }
debugassist-decisions = { workspace = true }
vitals-service = { workspace = true }
bugdrop-service = { workspace = true }
incidents-service = { workspace = true }
debugassist-simulator = { workspace = true }
debugassist-scenarios = { workspace = true }
debugassist-cli = { workspace = true }
debugassist-integrations = { workspace = true }
debugassist-mcp-servers = { workspace = true }
debugassist-llm = { workspace = true }
debugassist-pipeline = { workspace = true }
debugassist-api = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "pytest-cov>=7.0",
  "ruff>=0.14",
  "pyright>=1.1.406",
  "pre-commit>=4.3",
]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["targets", ".data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PTH", "TID"]
ignore = [
  "E501",    # the formatter owns line length; long string literals are fine
  "S101",    # asserts are fine in tests and invariants
  "RUF001",  # en dashes and arrows in prose are intentional
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["debugassist"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "PTH", "ASYNC221"]
# Dev/ops tooling that drives git, docker and psql on the developer's machine.
"packages/scenarios/**" = ["S603", "S607", "S602"]
"packages/simulator/**" = ["S603", "S607"]
# Fixed git/docker argv lists (never a shell) inside the sandbox worktree or the target checkouts.
"packages/integrations/**" = ["S603", "S607"]
"packages/mcp_servers/**" = ["S603", "S607"]
# Nodes run one at a time, so their short git calls cannot starve the event loop.
"packages/pipeline/src/debugassist/pipeline/nodes.py" = ["S603", "S607", "ASYNC221"]
"packages/pipeline/src/debugassist/pipeline/fixplan.py" = ["S603", "S607"]
"packages/pipeline/src/debugassist/pipeline/postpr.py" = ["S603", "S607", "ASYNC221"]
"packages/pipeline/src/debugassist/pipeline/feedback.py" = ["S603", "S607"]
"packages/pipeline/src/debugassist/pipeline/e2e.py" = ["S603", "S607", "S108"]
# Vendored into the services repo verbatim (formatted by that repo's ruff config).
"sources/vitals/sdk-py/**" = ["S310", "SIM105", "BLE001"]

[tool.pyright]
include = ["packages", "sources"]
exclude = ["**/node_modules", "**/__pycache__", "targets", ".data", "**/locustfile.py"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages", "sources"]
addopts = "--import-mode=importlib -q"
markers = ["live: hits a real external API (skipped unless DA_LIVE_TESTS=1)"]
