[project]
name = "debugassist-workspace"
version = "0.0.0"
description = "DebugAssist: crash/bug report → RCA → mitigation → validated PR, with Clef decision models"
requires-python = ">=3.13,<3.14"
readme = "README.md"
license = "MIT"
dependencies = ["debugassist-core", "debugassist-decisions"]

[tool.uv]
package = false
# uv-managed CPython: no distro sitecustomize.py shadowing scripts/venv_path_hook.py.
python-preference = "only-managed"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
debugassist-core = { workspace = true }
debugassist-decisions = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "pytest-cov>=7.0",
  "ruff>=0.14",
  "pyright>=1.1.406",
  "pre-commit>=4.3",
]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["targets", ".data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PTH", "TID"]
ignore = [
  "S101",    # asserts are fine in tests and invariants
  "RUF001",  # en dashes and arrows in prose are intentional
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["debugassist"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "PTH"]

[tool.pyright]
include = ["packages"]
exclude = ["**/node_modules", "**/__pycache__", "targets", ".data"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages"]
addopts = "--import-mode=importlib -q"
markers = ["live: hits a real external API (skipped unless DA_LIVE_TESTS=1)"]
