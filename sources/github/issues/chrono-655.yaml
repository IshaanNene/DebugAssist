body: |
  ### Description

  A numeric label followed by a colon can cause Chrono to discard the valid date immediately after it.

  This affects both strict and casual parsing in `chrono-node` 2.10.1.

  ### Reproduction

  ```js
  const chrono = require("chrono-node");

  const input = "24: July 23, 2026 at 3:30 PM";
  const referenceDate = new Date(2026, 6, 1, 8);

  console.log(
      chrono.strict.parse(input, referenceDate).map((result) => ({
          index: result.index,
          text: result.text,
          year: result.start.get("year"),
          month: result.start.get("month"),
          day: result.start.get("day"),
          hour: result.start.get("hour"),
      }))
  );
  ```

  Actual result:

  ```js
  [
      {
          index: 18,
          text: "at 3:30 PM",
          year: 2026,
          month: 7,
          day: 1,
          hour: 15,
      },
  ]
  ```

  The explicit `July 23, 2026` date is lost, and the date components are instead inferred from the reference date.

  Expected result:

  ```js
  [
      {
          index: 4,
          text: "July 23, 2026 at 3:30 PM",
          year: 2026,
          month: 7,
          day: 23,
          hour: 15,
      },
  ]
  ```

  `chrono.casual.parse` exhibits the same behavior.

  ### Regression range

  I tested the published releases:

  - 2.7.5 parses the complete timestamp correctly.
  - The regression begins in 2.7.6.
  - It remains present in 2.10.1.
withheld: "The two paragraphs after the regression range that name the cause (the change adding \":\" as a date/time merge separator, the time parser accepting a bare 24 as an hour, and the date/time refiner merging it with the following date), and the \"Proposed patch\" section with its diff and the note on testing it."
