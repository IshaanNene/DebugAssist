body: |
  **Describe the bug**

  Calling an instance method decorated with `cachedmethod` through its class raises `AttributeError`, even when the instance is explicitly supplied. This worked in cachetools 6.2.0 and fails on current master `9976f1a8076631560f49c5b0dfda7e4d00ee0a4a` (7.2.1), on Windows with Python 3.12.14.

  **Expected result**

  `Example.value(example, 3)` should behave like `example.value(3)`, including using the instance's cache. This is ordinary instance-method access, not `@classmethod` usage.

  **Actual result**

  The instance call returns `6`. The class call raises `AttributeError: 'NoneType' object has no attribute 'cache'`.

  **Reproduction steps**

  ```python
  from cachetools import Cache, cachedmethod

  class Example:
      def __init__(self):
          self.cache = Cache(2)

      @cachedmethod(lambda self: self.cache)
      def value(self, number):
          return number * 2

  example = Example()
  print(example.value(3))
  print(Example.value(example, 3))
  ```
