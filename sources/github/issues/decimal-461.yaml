body: |
  `Ln(10, 5)` returns `2.30258` instead of the documented five-place result `2.30259`.

  Save this as `main.go`.

  ```go
  // SPDX-License-Identifier: CC0-1.0
  package main

  import (
  	"fmt"
  	"github.com/shopspring/decimal"
  )

  func main() {
  	got, err := decimal.NewFromInt(10).Ln(5)
  	fmt.Println(got, err)
  }
  ```

  ```sh
  go mod init ln-repro
  go get github.com/shopspring/decimal@511ed65a1218564ab137d858d9bc4e995322f206
  go run -p 3 .
  ```

  We get `2.30258 <nil>` from the current implementation.

  Expected `2.30259` because `ln(10) = 2.302585092994...`, following the documented precision.

  Version: `511ed65a1218564ab137d858d9bc4e995322f206` (master), Go 1.27.2 and 1.26.9, Linux amd64.
withheld: "The paragraph naming the cause (the constant slice in const.go counting the decimal point as a digit), the two links that pointed at the implementing and documenting lines of math.go (the link texts are kept), \"Happy to send a fix.\" and the finder's signature line."
