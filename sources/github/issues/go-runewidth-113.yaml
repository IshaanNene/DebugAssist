body: |
  `IsEastAsian` reports a Japanese, Chinese or Korean locale as not East Asian when the locale name has no charset or has a CJK charset it does not recognise: `ja_JP.eucjp` is true but `ja_JP.EUC-JP` and `ja_JP` are false, `zh_CN.gbk` is true but `zh_CN.gb18030` is false, while `en_US.SJIS` is true:

  ```go
  package main

  import (
  	"fmt"
  	"os"

  	"github.com/mattn/go-runewidth"
  )

  func main() {
  	for _, locale := range []string{
  		"ja_JP.eucjp", "ja_JP.EUC-JP", "ja_JP",
  		"zh_CN.gbk", "zh_CN.gb18030",
  		"ko_KR.euckr", "ko_KR.EUC-KR",
  		"zh_TW.big5", "zh_TW.euctw", "zh_HK.big5hkscs",
  		"en_US.SJIS",
  	} {
  		os.Setenv("LC_ALL", locale)
  		fmt.Printf("%-16s %v\n", locale, runewidth.IsEastAsian())
  	}
  }
  ```

  Output:

  ```
  ja_JP.eucjp      true
  ja_JP.EUC-JP     false
  ja_JP            false
  zh_CN.gbk        true
  zh_CN.gb18030    false
  ko_KR.euckr      true
  ko_KR.EUC-KR     false
  zh_TW.big5       true
  zh_TW.euctw      false
  zh_HK.big5hkscs  false
  en_US.SJIS       true
  ```

  The false ones are locale names as systems spell them: macOS's `locale -a` lists `ja_JP`, `zh_CN`, `ko_KR`, `zh_CN.GB18030` and `zh_HK.Big5HKSCS`, and glibc's SUPPORTED file spells its EUC and Big5 locales `ja_JP.EUC-JP`, `ko_KR.EUC-KR`, `zh_TW.EUC-TW` and `zh_HK.BIG5-HKSCS` with the hyphen. A program started with `LC_ALL=zh_CN.gb18030` gets `DefaultCondition.EastAsianWidth` false and measures `■` at one cell; started with `LC_ALL=zh_CN.gbk` it gets true and two cells. I would expect a locale whose language is ja, ko or zh to count as East Asian whatever the charset spelling, unless `@cjk_narrow` says otherwise.

  Tested on go-runewidth v0.0.30, which is also current master (14205cc).
