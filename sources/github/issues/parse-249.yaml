body: |
  Two related gaps in the fixed-point / Decimal types.

  ## 1. `{:F}` (Decimal) cannot parse a negative number

  ```python
  >>> import parse
  >>> parse.parse("{:F}", "-2.5")
  None                       # expected Decimal('-2.5')
  >>> parse.parse("{:F}", "2.5")
  <Result (Decimal('2.5'),) {}>
  >>> parse.parse("{:f}", "-2.5")   # float, same regex, works
  <Result (-2.5,) {}>
  ```

  ## 2. `{:f}` and `{:F}` do not parse `nan`/`inf`, but `{:e}`/`{:g}` do

  ```python
  >>> parse.parse("{:f}", "nan")     # None
  >>> parse.parse("{:e}", "nan")     # nan
  ```
