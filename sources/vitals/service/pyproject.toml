[project]
name = "vitals-service"
version = "0.1.0"
description = "Vitals: crash, hang, jank and performance analytics (open-source stand-in for an internal app-quality tool)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.142",
  "uvicorn[standard]>=0.54",
  "sqlalchemy>=2.0.44,<2.1",
  "psycopg[binary]>=3.2",
  "httpx>=0.28",
  "jinja2>=3.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitals_service"]
