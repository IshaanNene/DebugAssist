[project]
name = "incidents-service"
version = "0.1.0"
description = "Incident and third-party dependency status (local stand-in for incident tooling)"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi>=0.142", "uvicorn[standard]>=0.54"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incidents_service"]
