id: BUG-009
title: Home screen crashes for riders in Tokyo after the nearest-places change
language: typescript
component: miniride-client
owner_team: rider-app
category: own_code
priority: P1
discovery: [vitals, bugdrop]
injection:
  base: v1.5.2
  release: 1.7.0
  repos:
    miniride-client: [patches/BUG-009/0001-feat-search-list-places-nearest-the-city-centre-firs.patch]
