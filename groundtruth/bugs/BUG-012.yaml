id: BUG-012
title: ETA stops updating once a trip starts (gateway errors on in-trip rides)
language: typescript
component: gateway
owner_team: rider-platform
category: own_code
priority: P2
discovery: [vitals, bugdrop]
injection:
  base: v1.5.1
  release: 1.7.3
  repos:
    miniride-services: [patches/BUG-012/0001-refactor-gateway-keep-ride-notification-copy-in-one-.patch]
trigger:
  scenario: normal_traffic
  params:
    sessions: 4
    city: sf
    seed: 25
    book_share: 1.0
    hold_s: 150
ground_truth:
  fix: fixes/BUG-012.patch
  hidden_tests:
