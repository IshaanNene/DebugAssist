id: BUG-020
title: During the trip the app always says arriving in "< 1 min" after the ETA refactor
language: python
component: dispatch
owner_team: dispatch
category: own_code
priority: P2
discovery: [bugdrop]
injection:
  base: v1.5.1
  release: 1.7.11
  repos:
    miniride-services: [patches/BUG-020/0001-refactor-dispatch-one-ETA-formula-for-every-ride-pha.patch]
trigger:
  scenario: symptom_report
  params:
    sessions: 2
    city: sf
    flow: book
    pickup: Ferry Building
    dropoff: SFO Airport
    testid: eta
    pattern: "^(< 1 min|\\d min)$"
    wait_s: 150
    report_text: "We're in the car from the Ferry Building to SFO and the app says we arrive in a couple of minutes. The airport is 40+ minutes away."
ground_truth:
  fix: fixes/BUG-020.patch
  hidden_tests:
    - { src: hidden_tests/BUG-020/test_trip_eta_hidden.py, repo: miniride-services, dest: dispatch/tests/test_trip_eta_hidden.py }
  location: { repo: miniride-services, module: dispatch, file: dispatch/src/dispatch/matching.py, function: eta_seconds }
  rca_facts:
    - 'Only rides in the in_trip phase are affected: their ETA keeps counting down the pickup time (a few minutes, then "< 1 min") instead of showing the time to the drop-off; pickup ETAs are fine.'
    - 'eta_seconds lost its in_trip branch, so during the trip it still measures driver-to-pickup time minus elapsed time instead of pickup-to-drop-off travel time.'
    - 'Regression introduced in 1.7.11 by "refactor(dispatch): one ETA formula for every ride phase".'
  mitigation: none
validation:
  cheapest_tier: unit
expected_outcome: pr
