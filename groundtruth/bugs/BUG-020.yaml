id: BUG-020
title: During the trip the app always says arriving in "< 1 min" after the ETA refactor
language: python
component: dispatch
owner_team: dispatch
category: own_code
priority: P2
discovery: [bugdrop]
injection:
  base: v1.5.1
  release: 1.7.11
  repos:
    miniride-services: [patches/BUG-020/0001-refactor-dispatch-one-ETA-formula-for-every-ride-pha.patch]
trigger:
  scenario: symptom_report
  params:
    sessions: 2
    city: sf
    flow: book
    testid: eta
    pattern: "^< 1 min$"
    wait_s: 140
    report_text: "We're in the car on the way to the airport and the app has said arriving in less than a minute for 20 minutes."
ground_truth:
  fix: fixes/BUG-020.patch
  hidden_tests:
    - { src: hidden_tests/BUG-020/test_trip_eta_hidden.py, repo: miniride-services, dest: dispatch/tests/test_trip_eta_hidden.py }
  location: { repo: miniride-services, module: dispatch, file: dispatch/src/dispatch/matching.py, function: eta_seconds }
  rca_facts:
    - 'Only rides in the in_trip phase are affected: their ETA is 0 ("< 1 min") for the whole trip; pickup ETAs are fine.'
    - 'eta_seconds lost its drop-off branch and measures from the driver (already at the pickup) to the pickup.'
    - 'Regression introduced in 1.7.11 by "refactor(dispatch): one ETA formula for every ride phase".'
  mitigation: none
validation:
  cheapest_tier: unit
expected_outcome: pr
