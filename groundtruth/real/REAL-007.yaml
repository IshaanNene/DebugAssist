ground_truth:
  location:
    repo: go-runewidth
    module: runewidth
    file: runewidth_posix.go
    function: isEastAsian
  rca_facts:
  - "isEastAsian decides from the locale's charset only, matching a fixed list of lower-case, hyphen-less spellings (eucjp, gbk, euckr, big5, ...)."
  - "A locale with no charset (ja_JP) or a charset spelled with a hyphen or upper case (ja_JP.EUC-JP, zh_CN.GB18030) is therefore not East Asian."
  - "The fix treats a ja, ko or zh language as East Asian whatever the charset (unless @cjk_narrow), and normalizes charset spellings."
