ground_truth:
  location:
    repo: cachetools-440
    module: src/cachetools
    file: src/cachetools/__init__.py
    function: __setitem__
  rca_facts:
  - TTLCache.__setitem__ inserts the value and links its expiration before computing timer() + ttl.
  - When that computation raises, the rejected entry stays in the cache with no expiration, so later comparisons fail with TypeError.
  - The fix computes the expiration before changing the cache's state.
  hidden_tests:
