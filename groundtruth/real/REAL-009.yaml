ground_truth:
  location:
    repo: chrono
    module: refiners
    file: src/common/refiners/AbstractMergeDateTimeRefiner.ts
    function: shouldMergeResults
  rca_facts:
  - "A bare number such as 24 followed by a colon is parsed as a time-only result (the hour 24)."
  - "The date/time merge refiner accepts ':' as a separator in both directions, so it merges that time with the date that follows, producing an invalid hour-24 datetime that is later dropped together with the date."
  - "The fix stops a lone ':' from merging a time-only result with a following date-only result (time:date); date:time merges stay."
  hidden_tests:
