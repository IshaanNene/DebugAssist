ground_truth:
  location:
    repo: decimal
    module: decimal
    file: math.go
    function: Ln
  rca_facts:
  - "Ln reduces its argument by powers of ten using a precomputed approximation of ln(10), and that approximation counts the decimal point as a digit, so one fractional digit of precision is lost before rounding."
  - "Ln(10, 5) is 2.302585..., which rounds to 2.30259; the lost digit makes it 2.30258."
  - "The fix computes Ln with error bounds, as Pow already does, and drops the constant-approximation slice (const.go)."
  hidden_tests:
