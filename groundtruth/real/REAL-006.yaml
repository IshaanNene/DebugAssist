    repo: decimal
    dest: decimal_test.go
    command: "go test -count=1 -run '^(TestDecimal_Ln|TestDecimal_LnPowersOfTen)$' ."
validation:
  verified: '2026-10-19'
  how: "on the buggy commit TestDecimal_Ln fails on the reported case (2.30258) and three others and TestDecimal_LnPowersOfTen fails; with the upstream fix both pass and go test ./... passes"
  hidden_test: "upstream's decimal_test.go at the fix, verbatim; TestDecimal_Ln (new cases) and the new TestDecimal_LnPowersOfTen are selected"
