  license: MIT (cachetools, © Thomas Kemmer) — the hidden test below is upstream's own regression test
ground_truth:
  # From the fix's diff: the class-access branch of the descriptor's __get__ returned the wrapper bound to None.
  location: { repo: cachetools, module: src/cachetools, file: src/cachetools/_cachedmethod.py, function: __get__ }
  rca_facts:
    - "Accessing a cachedmethod through its class (obj is None) returns a wrapper bound to None."
    - "Calling that wrapper with an explicit instance evaluates the cache factory with None, hence the AttributeError."
    - "The fix returns an unbound callable that binds the supplied instance through the descriptor."
  hidden_tests:
    # Upstream's tests/test_cachedmethod.py at the fix commit, copied in under another name so it cannot collide
