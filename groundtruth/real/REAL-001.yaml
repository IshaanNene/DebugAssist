    - src: real/REAL-001/test_cachedmethod_upstream.py
      repo: cachetools
      dest: tests/test_cachedmethod_upstream.py
      command: .venv/bin/python -m pytest -q tests/test_cachedmethod_upstream.py -k UnboundMethodTest
validation:
