# Builds apps/site (static export; every number read from evals/reports at build time) and deploys it to
# GitHub Pages (https://ishaannene.github.io/DebugAssist/). Redeploys on every push to main that touches the
# site or the files it reads at build time; can also be run by hand.
name: site

on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - evals/reports/** # results, context audits
      - groundtruth/bugs/** # catalog size and expected outcomes
      - docs/mcp.md # MCP server and tool counts
      - packages/decisions/templates/** # decision template count
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 — submodules are not needed: the site reads evals/, groundtruth/ and docs/
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: apps/site/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/site
      - run: pnpm build
        working-directory: apps/site
        env:
          SITE_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
