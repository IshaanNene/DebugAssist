name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    # No secrets: every integration resolves to mock mode.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: make coverage

  audit:
    runs-on: ubuntu-latest
    # Known-vulnerable dependencies fail the build: every locked Python package, and the dashboard's and SDKs'
    # production dependencies.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv export --locked --format requirements-txt --no-emit-workspace --no-hashes -q > requirements.txt
      - run: uvx pip-audit@2.9.0 --disable-pip --no-deps -r requirements.txt
      - name: no credential-shaped strings in tracked files
        run: git ls-files -z -- . ':!targets' | xargs -0 uv run python scripts/check_secrets.py
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { package_json_file: "apps/dashboard/package.json" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22 }
      - run: for d in apps/dashboard sources/vitals/sdk-js sources/bugdrop/sdk-js; do (cd "$d" && pnpm audit --prod) || exit 1; done

  sdks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: [sources/vitals/sdk-js, sources/bugdrop/sdk-js]
    defaults:
      run:
        working-directory: ${{ matrix.sdk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { package_json_file: "${{ matrix.sdk }}/package.json" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: pnpm, cache-dependency-path: "${{ matrix.sdk }}/pnpm-lock.yaml" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { package_json_file: "apps/dashboard/package.json" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/dashboard/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      # the API types are generated from openapi.json (`make api-types`); the Python tests check openapi.json
      # against the API itself, this checks the generated file against openapi.json
      - name: API types match the API's schema
        run: pnpm api-types && git diff --exit-code -- src/lib/api-schema.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  image-scan:
    # The runtime images, scanned for fixable critical CVEs (ROADMAP-100 010); also weekly from the workflow itself.
    uses: ./.github/workflows/image-scan.yml

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker compose -f infra/docker-compose.yml --profile '*' config -q
      - name: every published port is loopback-only
        run: docker compose -f infra/docker-compose.yml --profile '*' config --format json | python3 infra/check_loopback.py
