name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    # No secrets: every integration resolves to mock mode.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: make coverage

  audit:
    runs-on: ubuntu-latest
    # Known-vulnerable dependencies fail the build: every locked Python package, and the dashboard's and SDKs'
    # production dependencies.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv export --locked --format requirements-txt --no-emit-workspace --no-hashes -q > requirements.txt
      - run: uvx pip-audit@2.9.0 --disable-pip --no-deps -r requirements.txt
      - name: no credential-shaped strings in tracked files
        run: git ls-files -z -- . ':!targets' | xargs -0 uv run python scripts/check_secrets.py
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { package_json_file: "apps/dashboard/package.json" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22 }
      - run: for d in apps/dashboard sources/vitals/sdk-js sources/bugdrop/sdk-js; do (cd "$d" && pnpm audit --prod) || exit 1; done

  sdks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: [sources/vitals/sdk-js, sources/bugdrop/sdk-js]
    defaults:
      run:
        working-directory: ${{ matrix.sdk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { package_json_file: "${{ matrix.sdk }}/package.json" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: pnpm, cache-dependency-path: "${{ matrix.sdk }}/pnpm-lock.yaml" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { package_json_file: "apps/dashboard/package.json" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/dashboard/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker compose -f infra/docker-compose.yml --profile '*' config -q
      - name: every published port is loopback-only
        run: docker compose -f infra/docker-compose.yml --profile '*' config --format json | python3 infra/check_loopback.py
