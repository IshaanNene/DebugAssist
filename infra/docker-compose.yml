# DebugAssist local infrastructure. Services are grouped into profiles so a 24 GB laptop can run
# only what a phase needs:  make up PROFILES="core obs"
#   core   – Postgres (ledger, checkpoints, BugDrop/Vitals stores), Redis (job queue), MinIO (objects + artifact store)
#   obs    – Jaeger (traces), Loki (logs), Prometheus (metrics), Phoenix (agent traces)
#   flags  – Unleash (feature flags, gradual rollouts)
#   faults – Toxiproxy (network fault injection for the weak-network validation tier)
#   target – MiniRide: dispatch (Python), payments (Go), gateway (Node GraphQL), client (React PWA)
# Source (BugDrop, Vitals) and app services are added in later phases.
name: debugassist

x-restart: &restart
  restart: unless-stopped

x-health: &health
  interval: 5s
  timeout: 3s
  retries: 30

x-miniride-otel: &miniride-otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  UNLEASH_URL: http://unleash:4242/api
  UNLEASH_API_TOKEN: "default:development.unleash-insecure-api-token"
  SERVICE_VERSION: "1.4.0"

services:
  postgres:
    <<: *restart
    profiles: [core, flags, target]
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: debugassist
      POSTGRES_PASSWORD: debugassist  # local-only dev credential
      POSTGRES_DB: debugassist
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debugassist"]
      interval: 5s
      retries: 20

  redis:
    <<: *restart
    profiles: [core]
    image: redis:8.10.2-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  minio:
    <<: *restart
    profiles: [core]
    # Official minio/minio images are no longer published; Chainguard's build is the maintained stand-in.
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: debugassist
      MINIO_ROOT_PASSWORD: debugassist-dev  # local-only dev credential
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  jaeger:
    <<: *restart
    profiles: [obs]
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "16686:16686"  # UI + query API (OTLP is received via the collector)

  otel-collector:
    <<: *restart
    profiles: [obs]
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro"]
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP (services + browser)
    depends_on: [jaeger, loki, prometheus]

  loki:
    <<: *restart
    profiles: [obs]
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]

  prometheus:
    <<: *restart
    profiles: [obs]
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d",
              "--web.enable-remote-write-receiver"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  phoenix:
    <<: *restart
    profiles: [obs]
    image: arizephoenix/phoenix:20.19.0
    ports:
      - "6006:6006"  # UI + OTLP HTTP (/v1/traces)
    environment:
      PHOENIX_WORKING_DIR: /phoenix
    volumes: [phoenixdata:/phoenix]

  unleash:
    <<: *restart
    profiles: [flags]
    image: unleashorg/unleash-server:8.2.0
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://debugassist:debugassist@postgres:5432/unleash
      DATABASE_SSL: "false"
      LOG_LEVEL: warn
      # Local-only, well-known Unleash dev tokens (format <project>:<environment>.<secret>).
      INIT_ADMIN_API_TOKENS: "*:*.unleash-insecure-admin-api-token"
      INIT_BACKEND_API_TOKENS: "default:development.unleash-insecure-api-token"
      INIT_FRONTEND_API_TOKENS: "default:development.unleash-insecure-frontend-api-token"
      UNLEASH_FRONTEND_API_ORIGINS: "http://localhost:5173,http://localhost:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4242/health"]
      interval: 5s
      retries: 30
    ports: ["4242:4242"]

  toxiproxy:
    <<: *restart
    profiles: [faults]
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - "8474:8474"           # control API
      - "18000-18010:18000-18010"  # proxied listeners created at runtime

  # ---- MiniRide target system -------------------------------------------------------------
  dispatch:
    <<: *restart
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz')"]
    profiles: [target]
    build: ../targets/miniride-services/dispatch
    environment:
      <<: *miniride-otel
      OTEL_SERVICE_NAME: dispatch
      DISPATCH_DATABASE_URL: postgresql+psycopg://debugassist:debugassist@postgres:5432/miniride
    ports: ["8001:8001"]
    depends_on:
      postgres: { condition: service_healthy }

  payments:
    <<: *restart
    healthcheck:
      <<: *health
      test: ["CMD", "/payments", "healthcheck"]
    profiles: [target]
    build: ../targets/miniride-services/payments
    environment:
      <<: *miniride-otel
      OTEL_SERVICE_NAME: payments
    ports: ["8002:8002"]

  gateway:
    <<: *restart
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/healthz"]
    profiles: [target]
    build: ../targets/miniride-services/gateway
    environment:
      <<: *miniride-otel
      OTEL_SERVICE_NAME: gateway
      DISPATCH_URL: http://dispatch:8001
      PAYMENTS_URL: http://payments:8002
    ports: ["4000:4000"]
    depends_on:
      dispatch: { condition: service_healthy }
      payments: { condition: service_healthy }

  client:
    <<: *restart
    profiles: [target]
    build:
      context: ../targets/miniride-client
      args:
        VITE_GATEWAY_URL: http://localhost:4000
        VITE_UNLEASH_URL: http://localhost:4242/api/frontend
        VITE_UNLEASH_CLIENT_KEY: "default:development.unleash-insecure-frontend-api-token"
        VITE_OTLP_TRACES_URL: http://localhost:4318/v1/traces
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
    ports: ["8080:8080"]
    depends_on:
      gateway: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
  phoenixdata:
